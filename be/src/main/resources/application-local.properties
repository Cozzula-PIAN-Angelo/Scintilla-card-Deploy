# Profilo di sviluppo, attivo di default: permette di avviare il backend senza
# impostare variabili d'ambiente. Valori NON sicuri, mai usati su Render
# (lì SPRING_PROFILES_ACTIVE=prod). Le variabili d'ambiente, se presenti, vincono comunque.

jwt.secret=${JWT_SECRET:solo-sviluppo-locale-secret-di-almeno-32-caratteri}
admin.password=${ADMIN_PASSWORD:admin1234}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

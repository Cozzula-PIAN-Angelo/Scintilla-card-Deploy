spring.application.name=ecommerce

# Senza SPRING_PROFILES_ACTIVE parte il profilo "local" (application-local.properties),
# che ha i valori di sviluppo. Su Render SPRING_PROFILES_ACTIVE=prod li esclude.
spring.profiles.default=local

# Render assegna la porta in PORT; in locale 3001
server.port=${PORT:3001}
server.shutdown=graceful

# Database: in locale valgono i default. Su Render DatabaseUrl legge DATABASE_URL
# e sovrascrive queste tre proprietà
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/naso-commers}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
# API REST stateless: niente sessione Hibernate aperta fino alla serializzazione della risposta
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT: il secret non ha default, va sempre impostato (almeno 32 caratteri = 256 bit)
jwt.secret=${JWT_SECRET}
# 7 giorni in millisecondi
jwt.expiration=${JWT_EXPIRATION:604800000}

# Admin creato dal seeder: la password non ha default, va sempre impostata
admin.username=${ADMIN_USERNAME:admin}
admin.email=${ADMIN_EMAIL:admin@ecommerce.local}
admin.password=${ADMIN_PASSWORD}

# Paginazione
app.pagination.default-size=10
app.pagination.max-size=50

# CORS: origini del frontend, separate da virgola.
# In produzione ALLOWED_ORIGIN=https://<fe>.onrender.com
app.cors.allowed-origins=${ALLOWED_ORIGIN:http://localhost:5173,http://localhost:4173}

# API esterna Pokémon TCG: la chiave è facoltativa (senza, il limite di richieste è più basso)
pokemontcg.base-url=https://api.pokemontcg.io/v2
pokemontcg.api-key=${POKEMONTCG_API_KEY:}

# Set importati automaticamente se il catalogo è vuoto (id pokemontcg.io, separati da virgola;
# vuoto = nessun import). Altri set: POST /carte/importa-set/{setId} da admin
app.seed.set=${SEED_SET:base1}

# Import avviati dalle pagine pubbliche (prima apertura di un set o di un Pokémon): massimo per
# indirizzo IP all'ora e per tutto il sito al giorno, così la quota di pokemontcg.io non si esaurisce.
# Le aperture successive, lette dal database, non contano. Con POKEMONTCG_API_KEY si può alzare il giornaliero
app.import.limite-per-client=${IMPORT_LIMITE_CLIENT:30}
app.import.limite-giornaliero=${IMPORT_LIMITE_GIORNALIERO:400}

# Numero più alto del Pokédex nazionale (1025 a fine 2026): con una nuova generazione basta alzarlo
app.pokedex.numero-massimo=${POKEDEX_NUMERO_MASSIMO:1025}

# Su Render le richieste arrivano dal proxy: l'IP del visitatore (per il limite sugli import) si legge
# da X-Forwarded-For, accettato da Tomcat solo se arriva da un proxy della rete interna
server.forward-headers-strategy=native

# Health check per Render: si espone solo /actuator/health
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="CeloManca: segna le carte che hai, trova quelle che ti mancano e riempi il binder." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>CeloManca · Il binder delle tue carte</title>
    <script>
      // tema applicato prima del primo disegno, senza lampo di bianco: scelta salvata o, in mancanza, quella del sistema
      // (stessa chiave di src/theme/tema.ts)
      try {
        var tema = localStorage.getItem('scintilla.tema')
        if (tema !== 'chiaro' && tema !== 'scuro') tema = matchMedia('(prefers-color-scheme: dark)').matches ? 'scuro' : 'chiaro'
        document.documentElement.dataset.tema = tema
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

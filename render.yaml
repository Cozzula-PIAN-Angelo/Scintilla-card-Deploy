# Blueprint Render: database + backend + frontend.
# Su Render: New > Blueprint > repository > Apply.

databases:
  - name: scintilla-db
    databaseName: scintilla
    user: scintilla
    plan: free
    region: frankfurt

services:
  # ---------- Backend: Spring Boot via Docker ----------
  - type: web
    name: scintilla-be
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: be
    # dockerfilePath parte da rootDir; buildFilter dalla radice della repo.
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    buildFilter:
      paths:
        - be/**
        - render.yaml
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scintilla-db
          property: connectionString
      # Esclude application-local.properties (secret e password di sviluppo)
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Generato da Render al primo deploy, poi resta stabile
      - key: JWT_SECRET
        generateValue: true
      # Credenziali dell'admin creato dal seeder
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Origine del FE per il CORS, es. https://scintilla-fe.onrender.com
      - key: ALLOWED_ORIGIN
        sync: false
      # Facoltativa: senza chiave l'API Pokémon TCG ha un limite di richieste più basso
      - key: POKEMONTCG_API_KEY
        sync: false

  # ---------- Frontend: build Vite statica ----------
  - type: web
    name: scintilla-fe
    runtime: static
    rootDir: fe
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    buildFilter:
      paths:
        - fe/**
        - render.yaml
    envVars:
      # Indirizzo del BE, es. https://scintilla-be.onrender.com (senza / finale)
      - key: VITE_API_URL
        sync: false
    routes:
      # react-router: ogni percorso restituisce index.html
      - type: rewrite
        source: /*
        destination: /index.html

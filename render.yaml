# Blueprint Render: database + backend + frontend.
# Su Render: New > Blueprint > repository > Apply.
# Rinominare app-db / app-be / app-fe con il nome del progetto.

databases:
  - name: app-db
    databaseName: app
    user: app
    plan: free
    region: frankfurt

services:
  # ---------- Backend: Spring Boot via Docker ----------
  - type: web
    name: app-be
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: be
    # dockerfilePath parte da rootDir; buildFilter dalla radice della repo.
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    buildFilter:
      paths:
        - be/**
        - render.yaml
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: app-db
          property: connectionString
      # Origine del FE per il CORS, es. https://app-fe.onrender.com
      - key: ALLOWED_ORIGIN
        sync: false

  # ---------- Frontend: build Vite statica ----------
  - type: web
    name: app-fe
    runtime: static
    rootDir: fe
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    buildFilter:
      paths:
        - fe/**
        - render.yaml
    envVars:
      # Indirizzo del BE, es. https://app-be.onrender.com (senza / finale)
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
